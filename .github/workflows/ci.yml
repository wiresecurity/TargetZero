# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev,gws,vsphere]'
      - run: ruff check .
      - run: ruff format --check python
      - run: mypy
      - run: pytest -q
      - name: Wheel contains schemas and templates
        run: |
          pip wheel . --no-deps -w dist
          python -m zipfile -l dist/*.whl | grep -q 'targetzero/schemas/summary.schema.json'
          python -m zipfile -l dist/*.whl | grep -q 'targetzero/templates/exceptions.csv'

  powershell:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install modules
        run: |
          # Save pinned versions into a fresh folder and use only that plus the built-in modules.
          # Modules pre-installed on some runner images crash Test-ModuleManifest while it scans
          # module paths ("Value cannot be null. (Parameter 'name')").
          $folder = Join-Path $env:RUNNER_TEMP 'psmodules'
          $null = New-Item -ItemType Directory -Path $folder -Force
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Save-Module Pester -RequiredVersion 6.2.0 -Path $folder -Repository PSGallery
          Save-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Path $folder -Repository PSGallery
          Save-Module powershell-yaml -RequiredVersion 0.4.12 -Path $folder -Repository PSGallery
          "PSModulePath=$folder$([IO.Path]::PathSeparator)$(Join-Path $PSHOME 'Modules')" >> $env:GITHUB_ENV
      - name: PSScriptAnalyzer
        run: |
          # The manifest is checked with Test-ModuleManifest instead: the analyzer's manifest rule
          # crashes intermittently on Windows ("Collection was modified").
          Test-ModuleManifest -Path powershell/TargetZero/TargetZero.psd1 -ErrorAction Stop | Select-Object Name, Version
          # One file at a time, so a crash in the analyzer names the file.
          $results = foreach ($file in Get-ChildItem powershell -Recurse -Include *.ps1, *.psm1, *.psd1 |
              Where-Object Name -ne 'TargetZero.psd1') {
            try {
              Invoke-ScriptAnalyzer -Path $file.FullName -Settings powershell/PSScriptAnalyzerSettings.psd1 -ErrorAction Stop
            }
            catch {
              throw "PSScriptAnalyzer failed on $($file.FullName): $($_.Exception.ToString())"
            }
          }
          $results | Format-Table -AutoSize
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) issue(s)" }
      - name: Pester
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'powershell/Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact -v
