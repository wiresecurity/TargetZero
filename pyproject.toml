[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "targetzero"
version = "0.3.2"
description = "Tooling for the Target 0 campaign: count, fix and report seven security zeros."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wire Security" }]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "dnspython>=2.6",
    "defusedxml>=0.7.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
gws = [
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]
vsphere = [
    "pyvmomi>=8.0.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    "types-defusedxml",
]

[project.scripts]
targetzero = "targetzero.cli:main"

[project.urls]
Homepage = "https://github.com/wiresecurity/TargetZero"
Issues = "https://github.com/wiresecurity/TargetZero/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/targetzero"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "targetzero/schemas"
"templates" = "targetzero/templates"
"config/targetzero.example.yaml" = "targetzero/config/targetzero.example.yaml"
"config/approved_exposure.example.csv" = "targetzero/config/approved_exposure.example.csv"
"config/privileged_roles.yaml" = "targetzero/config/privileged_roles.yaml"

[tool.hatch.build.targets.sdist]
include = ["python/targetzero", "schema", "templates", "config/*.example.*", "config/privileged_roles.yaml", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
packages = ["targetzero"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "pyVim.*", "pyVmomi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyvmomi has no type information.
module = ["targetzero.vendors.vsphere"]
disallow_untyped_calls = false
