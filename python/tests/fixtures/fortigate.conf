#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890
#buildno=1517
#global_vdom=1
config system global
    set hostname "FGT-HQ"
    set admin-sport 443
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2examplehashonly
    next
    edit "jane.admin"
        set accprofile "super_admin"
        set vdom "root"
        set two-factor fortitoken
        set fortitoken "FTKMOB0000000000"
        set trusthost1 198.51.100.0 255.255.255.0
    next
    edit "helpdesk"
        set accprofile "prof_readonly"
        set vdom "root"
        set two-factor sms
    next
    edit "radius-admins"
        set remote-auth enable
        set accprofile "super_admin"
        set vdom "root"
        set wildcard enable
        set remote-group "RADIUS-Admins"
    next
    edit "bg-fw"
        set accprofile "super_admin"
        set vdom "root"
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping https ssh
        set role wan
    next
    edit "wan2"
        set vdom "root"
        set allowaccess ping
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping https ssh http
        set role lan
    next
end
